{% extends "base.html" %}
{% block titulo %}Mi contraseña · Sistema de Obras{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div>
    <nav class="migas" aria-label="Ruta"><a href="{% url 'mis_obras' %}">Obras</a></nav>
    <h1>Cambiar mi contraseña</h1>
  </div>
</div>
<div class="tarjeta" style="max-width:560px">
  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="pie-form"><button type="submit">Cambiar contraseña</button></div>
  </form>
</div>
{% endblock %}
