{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Sistema de Obras{% endblock %}
{% block contenido %}
<div class="tarjeta login">
  <h1>Iniciar sesión</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
